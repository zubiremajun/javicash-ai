<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1412">
<title>JaviCash AI</title>
<style>
:root{--bg:#f6f8f7;--surface:#fff;--border:#e3e8e6;--text:#14201c;--muted:#6b7b75;--accent:#0f9d6e;--accent-ink:#fff;--bot:#fff;--user:#0f9d6e;--shadow:0 8px 28px rgba(16,40,32,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1412;--surface:#141f1b;--border:#22302b;--text:#e8f0ed;--muted:#8a9d96;--accent:#22c08a;--accent-ink:#04120d;--bot:#141f1b;--user:#1a8f68;--shadow:0 8px 28px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,"Noto Sans Bengali",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{width:38px;height:38px;border-radius:12px;object-fit:cover;background:var(--accent)}
header h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
header p{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
header p:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.row{display:flex;gap:10px;align-items:flex-start;animation:in .25s ease}
.row.user{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{width:32px;height:32px;border-radius:10px;object-fit:cover;background:var(--accent);flex-shrink:0}
.col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:min(84%,580px)}
.msg{max-width:min(82%,560px);padding:11px 15px;border-radius:18px;line-height:1.6;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.col .msg{max-width:100%}
.bot .msg{background:var(--bot);border:1px solid var(--border);border-top-left-radius:6px}
.user .msg{background:var(--user);color:#fff;border-top-right-radius:6px}
.msg img{display:block;max-width:100%;max-height:240px;border-radius:12px;margin-bottom:8px}
.acts{display:flex;gap:4px;margin-left:2px}
.abtn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:transparent;color:var(--muted);padding:0;border-radius:10px;cursor:pointer;transition:.15s}
.abtn:hover{background:var(--surface);color:var(--text)}
.abtn:active{transform:scale(.92)}
.abtn.on{color:var(--accent)}
.abtn .i{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;white-space:normal}
.chips button{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
.chips button .i{width:16px;height:16px;color:var(--accent)}
.chips button:hover{border-color:var(--accent)}
.chips button:active{transform:scale(.97)}
.dots{display:inline-flex;gap:4px;padding:5px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-4px);opacity:.5}}
.dock{padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);position:relative}
#preview{display:none;margin:0 4px 8px;position:relative;width:max-content}
#preview img{height:64px;border-radius:12px;border:1px solid var(--border);display:block}
#preview button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:grid;place-items:center;cursor:pointer}
#preview .i{width:12px;height:12px;stroke-width:2.4}
.bar{display:flex;align-items:flex-end;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);max-width:760px;margin:0 auto}
.bar:focus-within{border-color:var(--accent)}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.5;padding:9px 6px;max-height:120px}
textarea::placeholder{color:var(--muted)}
.btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.15s}
.btn:hover{background:var(--bg);color:var(--text)}
.btn.rec{background:#e5484d;color:#fff;animation:p 1.2s infinite}
@keyframes p{50%{box-shadow:0 0 0 7px rgba(229,72,77,.18)}}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{background:var(--border);color:var(--muted);cursor:default}
#menu{position:absolute;left:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:230px;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;transition:.16s;transform-origin:bottom left;z-index:5}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;color:var(--text);font:inherit;font-size:14.5px;border-radius:10px;cursor:pointer;text-align:left}
#menu button:hover{background:var(--bg)}
#menu .i{color:var(--accent)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>

<script>
// ================= SETTINGS =================
const API_KEY = "AQ.Ab8RN6KVIjjUzX3IeBOmRwO8kG3cXeHClY_H9J9z76vniitjbw";   // <-- PUT YOUR NEW GEMINI API KEY INSIDE THE QUOTES

const SYSTEM = `তুমি 'JaviCash' অ্যাপ এবং জুবায়ের ওসমানীর অফিসিয়াল ভয়েস ও অল-ইন-ওয়ান AI অ্যাসিস্ট্যান্ট। তোমার দায়িত্ব হলো ইউজারকে জাবি ক্যাশ অ্যাপ, গেমস এবং জুবায়ের ওসমানীর তথ্য দিয়ে সাহায্য করা।
[গুরুত্বপূর্ণ নির্দেশাবলী ও নিয়মাবলি]
১. ভাষার নিয়ম: ইউজার যে ভাষায় (বাংলা, ইংরেজি, বা অন্য যেকোনো ভাষা) প্রশ্ন করবে বা কথা বলবে, তোমাকে হুবহু সেই ভাষাতেই উত্তর দিতে হবে। সবসময় স্পষ্ট ও সহজ ভাষায় উত্তর প্রদান করবে।
২. এডমিন প্যানেল সম্পর্কিত সীমানা: এডমিন প্যানেল, ব্যাকএন্ড, সিকিউরিটি বা এডমিনের ভেতরের বিষয় নিয়ে কেউ প্রশ্ন করলে সরাসরি উত্তর দেবে: "দুঃখিত, এই বিষয়টি সম্পর্কে কথা বলা আমার সীমার বাইরে। Zubairosmani 549 আমাকে এটি নিয়ে কথা বলতে নিষেধ করেছেন।"
৩. ডেটাবেস ও ব্যাকএন্ড সম্পর্কিত সীমানা: অ্যাপ বা গেমের কয়েন কীভাবে ব্যাকএন্ডে বা ডেটাবেসে জমা হয়, সেই প্রযুক্তিগত কথা কখনোই বলবে না।
৪. আয়ের হিসাব সম্পর্কিত সীমানা: ইউজার যদি প্রশ্ন করে "একটি বিজ্ঞাপনের পেছনে জাবি ক্যাশ কত টাকা পায়?" বা কোম্পানি কত আয় করে, তবে উত্তর দেবে: "এ বিষয়ে কোনো কিছু জানা বা বলার মতো সক্ষমতা আমার নেই।"
৫. ইউজার শুধু হ্যালো/হাই/সালাম লিখলে বা বললে ইউজারের ভাষায় বলবে: "Assalamu Alaikum! I'm JaviCash AI. How can I help you? Speak to me by voice, or send a screenshot or text if I can't understand."
[১. অ্যাপের লগইন, পাসওয়ার্ড রিসেট ও ড্যাশবোর্ড তথ্য]
পাসওয়ার্ড ভুলে গেলে: ১) অ্যাপের 'Forget Password' অপশনে যেতে হবে। ২) 'Unique ID' এবং নিবন্ধিত 'Gmail' বসাতে হবে। ৩) জিমেইলে একটি OTP কোড যাবে, সেটি দিয়ে ভেরিফাই করতে হবে। ৪) OTP সফল হলে জিমেইলে গুগল/ফায়ারবেস থেকে একটি পাসওয়ার্ড রিসেট লিংক আসবে। ৫) সেই লিংকে ক্লিক করে নতুন পাসওয়ার্ড সেট করে নতুন পাসওয়ার্ড দিয়ে আবার লগইন করতে হবে।
স্ক্রিনশট বা ছবি পাঠালে: কেবল হোম স্ক্রিন, লগইন এবং ড্যাশবোর্ডের দৃশ্যমান বাটন ও পেজের ব্যবহারের তথ্য সহজভাবে বুঝিয়ে দেবে।
[২. গেমস এবং কয়েন]
গেমের স্ক্রিনশট দিলে গেমের ভেতরে কী করতে হবে তা বিশ্লেষণ করে উত্তর দেবে।
কয়েন কীভাবে জমা বা আর্ন হচ্ছে জিজ্ঞেস করলে বলবে: "আপনি গেম খেলছেন এবং প্রতিটি বিজ্ঞাপনের জন্য জাবি ক্যাশ আপনাকে ১০টি করে কয়েন দিচ্ছে। বিজ্ঞাপন দেখে গেম খেলে আপনি কয়েন আর্ন করতে পারবেন।"
[৩. জুবায়ের ওসমানী]
তোমাকে কে বানিয়েছে?: "আমাকে বানিয়েছেন জুবায়ের ওসমানী (Zubairosmani 549)।"
জন্মস্থান: "উনার জন্মস্থান মিয়ানমারের মংডু জেলার ইয়ং সং (হাদিবিল) গ্রামে।"
পিতার নাম: "উনার বাবার নাম ওসমান।" মাতার নাম: "উনার মায়ের নাম ইয়াসমিন।"
পরিচয়: "জুবায়ের ওসমানী একজন সফটওয়্যার ও অ্যাপ ডেভেলপার। তিনি ওয়েবসাইট, অ্যান্ড্রয়েড অ্যাপ এবং বিভিন্ন ডিজিটাল টেকনোলজি প্রজেক্ট নিয়ে কাজ করেন। উনার গুগল সাইট ওয়েবসাইটে উনার ব্যক্তিগত জীবন, শিক্ষা, টেকনোলজি বিষয়ক চিন্তাভাবনা এবং গল্পগুলো বিস্তারিতভাবে সাজানো আছে।"
[৪. বহির্ভূত প্রশ্ন]
অ্যাপ, গেম বা জুবায়ের ওসমানীর পরিধির বাইরের প্রশ্ন হলে অত্যন্ত মার্জিতভাবে বলবে যে তোমার কেবল জাবি ক্যাশ অ্যাপ ও নির্ধারিত ওয়েবসাইট সংক্রান্ত তথ্য দেওয়ার ক্ষমতা আছে।
উত্তর সবসময় ছোট, স্পষ্ট ও মোবাইলে পড়ার উপযোগী রাখবে।
Default language is English. Always reply in the exact language the user wrote or spoke, in that language's native script.`;

// ================= CORE =================
const $=id=>document.getElementById(id);
const chat=$('chat'),inp=$('inp'),sendBtn=$('send'),menu=$('menu'),micBtn=$('mic');
const icon=(n,c='')=>`<svg class="i ${c}"><use href="#${n}"/></svg>`;
let history=[],img=null,busy=false;
const H=()=>({'Content-Type':'application/json','x-goog-api-key':API_KEY});

function add(role,text,src){
  const r=document.createElement('div');r.className='row '+role;
  r.innerHTML=(role==='bot'?`<img class="av" src="${LOGO}" alt="">`:'')+'<div class="col"><div class="msg"></div></div>';
  const m=r.querySelector('.msg');
  if(src){const i=new Image();i.src=src;m.appendChild(i)}
  const t=document.createElement('span');t.textContent=text;m.appendChild(t);
  chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return t;
}
function sync(){sendBtn.disabled=busy||(!inp.value.trim()&&!img)}

// ---- images ----
function loadImg(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.82);img={data:u.split(',')[1],url:u};
    $('pimg').src=u;$('preview').style.display='block';sync();
  };im.src=r.result};
  r.readAsDataURL(f);
}
gal.onchange=e=>{loadImg(e.target.files[0]);e.target.value=''};
cam.onchange=e=>{loadImg(e.target.files[0]);e.target.value=''};
function clearImg(){img=null;$('preview').style.display='none';sync()}

// ---- voice input: records audio, Gemini detects ANY language automatically ----
let mr=null,chunks=[],stream=null,micTimer;
async function toggleMic(){
  if(mr){mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){alert('Voice input is not supported in this browser. Please use Chrome or Safari.');return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Microphone permission is required.');return}
  chunks=[];mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstart=()=>{micBtn.classList.add('rec');micBtn.innerHTML=icon('stop');inp.placeholder='Listening... tap to stop'};
  mr.onstop=async()=>{
    clearTimeout(micTimer);stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mr.mimeType});mr=null;
    micBtn.classList.remove('rec');micBtn.innerHTML=icon('mic');
    await transcribe(blob);
  };
  mr.start();micTimer=setTimeout(()=>mr&&mr.stop(),60000);
}
async function toWav(blob){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const dec=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close();
  const off=new OfflineAudioContext(1,Math.ceil(dec.duration*16000),16000);
  const s=off.createBufferSource();s.buffer=dec;s.connect(off.destination);s.start();
  const pcm=(await off.startRendering()).getChannelData(0),n=pcm.length;
  const o=new DataView(new ArrayBuffer(44+n*2));
  const w=(p,t)=>{for(let i=0;i<t.length;i++)o.setUint8(p+i,t.charCodeAt(i))};
  w(0,'RIFF');o.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
  o.setUint32(24,16000,true);o.setUint32(28,32000,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const v=Math.max(-1,Math.min(1,pcm[i]));o.setInt16(44+i*2,v<0?v*32768:v*32767,true)}
  const u8=new Uint8Array(o.buffer);let b='';
  for(let i=0;i<u8.length;i+=8192)b+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  return btoa(b);
}
async function transcribe(blob){
  inp.placeholder='Transcribing...';inp.disabled=true;
  try{
    const data=await toWav(blob);
    const res=await fetch(`${API}${MODEL}:generateContent`,{method:'POST',headers:H(),body:JSON.stringify({
      contents:[{parts:[{inline_data:{mime_type:'audio/wav',data}},{text:'Transcribe this audio exactly as spoken, in the original language and its native script. Output only the transcript. If there is no speech, output nothing.'}]}],
      generationConfig:{temperature:0}})});
    const j=await res.json();
    const t=(j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'').trim();
    inp.disabled=false;inp.placeholder='Type a message...';
    if(t){inp.value=t;send()}
  }catch(e){inp.disabled=false;inp.placeholder='Type a message...';alert('Could not process your voice. Please try again.')}
}

// ---- message buttons: copy, play (listen), like, dislike ----
let actx,curSrc=null,curBtn=null;
function langOf(t){
  if(/[\u0980-\u09FF]/.test(t))return'bn-BD';
  if(/[\u0900-\u097F]/.test(t))return'hi-IN';
  if(/[\u0600-\u06FF]/.test(t))return'ar-SA';
  if(/[\u0400-\u04FF]/.test(t))return'ru-RU';
  if(/[\u3040-\u30FF]/.test(t))return'ja-JP';
  if(/[\uAC00-\uD7AF]/.test(t))return'ko-KR';
  if(/[\u4E00-\u9FFF]/.test(t))return'zh-CN';
  if(/[\u0E00-\u0E7F]/.test(t))return'th-TH';
  return'en-US';
}
function stopSpeech(){
  if(curSrc){try{curSrc.onended=null;curSrc.stop()}catch(e){}curSrc=null}
  try{speechSynthesis.cancel()}catch(e){}
  if(curBtn){curBtn.innerHTML=icon('play');curBtn.setAttribute('aria-label','Listen');curBtn=null}
}
function fallbackSpeak(clean,btn,err){
  const why=err&&err.message?err.message:String(err||'');
  if(!('speechSynthesis' in window)){stopSpeech();alert('Voice could not be played.\n'+why);return}
  const lang=langOf(clean);
  const vs=speechSynthesis.getVoices()||[];
  const want=lang.toLowerCase();
  const v=vs.find(x=>(x.lang||'').replace('_','-').toLowerCase()===want)||vs.find(x=>(x.lang||'').toLowerCase().startsWith(want.slice(0,2)));
  if(vs.length&&!v){stopSpeech();alert('Voice could not be played. Your phone has no voice for this language.\n'+why);return}
  const u=new SpeechSynthesisUtterance(clean);u.lang=lang;if(v)u.voice=v;
  u.onend=()=>stopSpeech();u.onerror=()=>stopSpeech();
  speechSynthesis.cancel();speechSynthesis.speak(u);
  btn.innerHTML=icon('stop');btn.setAttribute('aria-label','Stop');
}
async function speak(text,btn){
  if(curBtn===btn){stopSpeech();return}
  stopSpeech();curBtn=btn;
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();
  btn.innerHTML=icon('loader','spin');
  const clean=text.replace(/[*_`#]/g,'').trim().slice(0,1500);
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),20000);
  try{
    const res=await fetch(`${API}${TTS_MODEL}:generateContent`,{method:'POST',signal:ctrl.signal,headers:H(),body:JSON.stringify({
      contents:[{parts:[{text:clean}]}],
      generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:TTS_VOICE}}}}})});
    clearTimeout(to);
    if(!res.ok){
      let m=String(res.status);
      try{const ej=await res.json();m=res.status+': '+(ej.error&&ej.error.message||'')}catch(x){}
      throw new Error(m);
    }
    const j=await res.json();
    const part=(j.candidates?.[0]?.content?.parts||[]).find(p=>p.inlineData||p.inline_data);
    const d=part&&(part.inlineData||part.inline_data);
    if(!d)throw new Error('No audio returned');
    const rate=+((/rate=(\d+)/.exec(d.mimeType||d.mime_type||'')||[])[1])||24000;
    const bin=atob(d.data),n=bin.length>>1,f=new Float32Array(n);
    for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;f[i]=v/32768}
    if(curBtn!==btn)return;
    const buf=actx.createBuffer(1,n,rate);buf.copyToChannel(f,0);
    const s=actx.createBufferSource();s.buffer=buf;s.connect(actx.destination);
    s.onended=()=>{if(curSrc===s)stopSpeech()};curSrc=s;s.start();
    btn.innerHTML=icon('stop');btn.setAttribute('aria-label','Stop');
  }catch(e){
    clearTimeout(to);
    if(curBtn!==btn)return;
    fallbackSpeak(clean,btn,e);
  }
}
function addActions(span,text){
  const a=document.createElement('div');a.className='acts';
  a.innerHTML=
    `<button class="abtn" aria-label="Copy">${icon('copy')}</button>`+
    `<button class="abtn" aria-label="Listen">${icon('play')}</button>`+
    `<button class="abtn" aria-label="Like">${icon('thumbup')}</button>`+
    `<button class="abtn" aria-label="Dislike">${icon('thumbdown')}</button>`;
  const [cp,sp,up,dn]=a.children;
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
    cp.innerHTML=icon('check');cp.classList.add('on');
    setTimeout(()=>{cp.innerHTML=icon('copy');cp.classList.remove('on')},1500);
  };
  sp.onclick=()=>speak(text,sp);
  up.onclick=()=>{up.classList.toggle('on');dn.classList.remove('on')};
  dn.onclick=()=>{dn.classList.toggle('on');up.classList.remove('on')};
  span.closest('.col').appendChild(a);
}

// buttons under the welcome message
addActions($('welcome'),"Assalamu Alaikum! I'm JaviCash AI. How can I help you? Speak to me with your voice. If I can't understand, send a screenshot or type your message.");

// ---- send (streaming) ----
async function send(){
  const text=inp.value.trim();
  if(busy||(!text&&!img))return;
  busy=true;
  const parts=[];if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:img.data}});
  parts.push({text:text||'Please explain this image.'});
  add('user',text,img&&img.url);inp.value='';inp.style.height='auto';clearImg();
  history.push({role:'user',parts});
  const out=add('bot','');out.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';let full='';
  try{
    const res=await fetch(`${API}${MODEL}:streamGenerateContent?alt=sse`,{
      method:'POST',headers:H(),
      body:JSON.stringify({
        system_instruction:{parts:[{text:SYSTEM}]},
        contents:history.slice(-12),
        generationConfig:{temperature:.5,maxOutputTokens:2048}
      })
    });
    if(!res.ok){
      let m=String(res.status);
      try{const ej=await res.json();m=res.status+': '+(ej.error&&ej.error.message||'')}catch(x){}
      throw new Error(m);
    }
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith('data:'))continue;
        try{const j=JSON.parse(l.slice(5));
          full+=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
          out.textContent=full;chat.scrollTop=chat.scrollHeight}catch(e){}
      }
    }
    if(full){addActions(out,full);history.push({role:'model',parts:[{text:full}]})}
    else{out.textContent='Sorry, no response received.';history.pop()}
  }catch(e){
    out.textContent='Something went wrong ('+e.message+')';
    history.pop();
  }
  busy=false;sync();
}
